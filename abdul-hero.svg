<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ab-title ab-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ab-title">Md Abdul Basid</title>
  <desc id="ab-desc">Data Analyst, Data Engineer, Data Scientist. Midnight blue banner with a technical grid, a rising chart and an extract, transform, load pipeline.</desc>
  <defs>
    <linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060B16"/>
      <stop offset="0.55" stop-color="#0B1530"/>
      <stop offset="1" stop-color="#14297A"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;12 .5 .5;0 .5 .5" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="ab-glow" cx="0.8" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#1E3A8A" stop-opacity="0.8"/>
      <stop offset="0.55" stop-color="#14297A" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#060B16" stop-opacity="0"/>
      <animate attributeName="cx" values="0.76;0.84;0.76" dur="12s" repeatCount="indefinite"/>
    </radialGradient>
    <pattern id="ab-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#60A5FA" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="ab-fade" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="ab-gridmask"><rect width="1200" height="420" fill="url(#ab-fade)"/></mask>
    <linearGradient id="ab-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E3A8A" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#2563EB"/>
      <stop offset="0.6" stop-color="#BFDBFE"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.35 0;0.15 0;-0.35 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ab-chart" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="0.6" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="ab-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
    <filter id="ab-blur" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="ab-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="ab-clip"><rect width="1200" height="420" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#ab-clip)">
    <rect width="1200" height="420" fill="url(#ab-bg)"/>
    <rect width="1200" height="420" fill="url(#ab-glow)"/>
    <rect width="1200" height="420" fill="url(#ab-grid)" opacity="0.2" mask="url(#ab-gridmask)"/>

    <!-- bars: quiet data backdrop -->
    <g opacity="0.55">
      <rect x="690" y="366" width="20" height="38" rx="3" fill="url(#ab-bar)"><animate attributeName="height" values="21;38;21" dur="5s" repeatCount="indefinite"/><animate attributeName="y" values="383;366;383" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="728" y="344" width="20" height="60" rx="3" fill="url(#ab-bar)"><animate attributeName="height" values="33;60;33" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="371;344;371" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="766" y="356" width="20" height="48" rx="3" fill="url(#ab-bar)"><animate attributeName="height" values="26;48;26" dur="7s" repeatCount="indefinite"/><animate attributeName="y" values="378;356;378" dur="7s" repeatCount="indefinite"/></rect>
      <rect x="804" y="320" width="20" height="84" rx="3" fill="url(#ab-bar)"><animate attributeName="height" values="46;84;46" dur="8s" repeatCount="indefinite"/><animate attributeName="y" values="358;320;358" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="842" y="338" width="20" height="66" rx="3" fill="url(#ab-bar)"><animate attributeName="height" values="36;66;36" dur="5s" repeatCount="indefinite"/><animate attributeName="y" values="368;338;368" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="880" y="300" width="20" height="104" rx="3" fill="url(#ab-bar)"><animate attributeName="height" values="57;104;57" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="347;300;347" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="918" y="322" width="20" height="82" rx="3" fill="url(#ab-bar)"><animate attributeName="height" values="45;82;45" dur="7s" repeatCount="indefinite"/><animate attributeName="y" values="359;322;359" dur="7s" repeatCount="indefinite"/></rect>
      <rect x="956" y="282" width="20" height="122" rx="3" fill="url(#ab-bar)"><animate attributeName="height" values="67;122;67" dur="8s" repeatCount="indefinite"/><animate attributeName="y" values="337;282;337" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="994" y="306" width="20" height="98" rx="3" fill="url(#ab-bar)"><animate attributeName="height" values="54;98;54" dur="5s" repeatCount="indefinite"/><animate attributeName="y" values="350;306;350" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="1032" y="264" width="20" height="140" rx="3" fill="url(#ab-bar)"><animate attributeName="height" values="77;140;77" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="327;264;327" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="1070" y="286" width="20" height="118" rx="3" fill="url(#ab-bar)"><animate attributeName="height" values="65;118;65" dur="7s" repeatCount="indefinite"/><animate attributeName="y" values="339;286;339" dur="7s" repeatCount="indefinite"/></rect>
      <rect x="1108" y="248" width="20" height="156" rx="3" fill="url(#ab-bar)"><animate attributeName="height" values="86;156;86" dur="8s" repeatCount="indefinite"/><animate attributeName="y" values="318;248;318" dur="8s" repeatCount="indefinite"/></rect>
      
    </g>

    <!-- chart line -->
    <path d="M -20 372 L 90 352 L 170 362 L 290 326 L 380 340 L 500 300 L 590 314 L 720 268 L 800 286 L 930 240 L 1010 258 L 1130 210 L 1230 222" fill="none" stroke="#1E3A8A" stroke-width="1" opacity="0.7"/>
    <path d="M -20 372 L 90 352 L 170 362 L 290 326 L 380 340 L 500 300 L 590 314 L 720 268 L 800 286 L 930 240 L 1010 258 L 1130 210 L 1230 222" fill="none" stroke="url(#ab-chart)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1000" stroke-dasharray="240 760" opacity="0.95">
      <animate attributeName="stroke-dashoffset" values="1000;0" dur="9s" repeatCount="indefinite"/>
    </path>

    <!-- extract / transform / load pipeline -->
    <path d="M 760 210 C 820 110, 870 110, 930 210 S 1040 310, 1100 210" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.7"/>
    <g>
      <circle cx="760" cy="210" r="30" fill="#0B1530" stroke="#2563EB" stroke-width="1.5"/>
      <circle cx="760" cy="210" r="30" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.6">
        <animate attributeName="r" values="30;46;30" dur="4s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="4s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="760" cy="210" r="6" fill="#BFDBFE"/>
      <text x="760" y="268" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#60A5FA" letter-spacing="2.5">EXTRACT</text>
    </g>
    <g>
      <circle cx="930" cy="210" r="30" fill="#0B1530" stroke="#2563EB" stroke-width="1.5"/>
      <circle cx="930" cy="210" r="30" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.6">
        <animate attributeName="r" values="30;46;30" dur="4s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="4s" begin="1.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="930" cy="210" r="6" fill="#BFDBFE"/>
      <text x="930" y="268" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#60A5FA" letter-spacing="2.5">TRANSFORM</text>
    </g>
    <g>
      <circle cx="1100" cy="210" r="30" fill="#0B1530" stroke="#2563EB" stroke-width="1.5"/>
      <circle cx="1100" cy="210" r="30" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.6">
        <animate attributeName="r" values="30;46;30" dur="4s" begin="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="4s" begin="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1100" cy="210" r="6" fill="#BFDBFE"/>
      <text x="1100" y="268" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#60A5FA" letter-spacing="2.5">LOAD</text>
    </g>
    <circle r="5" fill="#BFDBFE" filter="url(#ab-soft)"><animateMotion dur="7s" repeatCount="indefinite" path="M 760 210 C 820 110, 870 110, 930 210 S 1040 310, 1100 210"/></circle>

    <!-- type -->
    <text x="70" y="128" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" fill="#60A5FA" letter-spacing="2">&gt; hello, world<tspan fill="#BFDBFE">_<animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></tspan></text>
    <text x="68" y="206" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#F1F5F9" letter-spacing="0.5">Md Abdul Basid
      <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
    </text>
    <text x="70" y="252" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#BFDBFE" letter-spacing="1.6">Data Analyst  ·  Data Engineer  ·  Data Scientist
      <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="1.4s" fill="freeze"/>
    </text>

    <!-- glowing underline -->
    <rect x="70" y="272" width="430" height="4" rx="2" fill="#2563EB" opacity="0.6" filter="url(#ab-blur)"/>
    <rect x="70" y="272" width="430" height="3" rx="1.5" fill="url(#ab-line)"/>

    <text x="70" y="314" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" fill="#60A5FA" letter-spacing="1.5" opacity="0.9">Python  /  SQL  /  Pandas  /  Power BI  /  ETL</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="17.5" fill="none" stroke="#1E3A8A" stroke-opacity="0.7"/>
</svg>
