<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-labelledby="ab-f-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ab-f-title">Decorative blue wave footer</title>
  <defs>
    <linearGradient id="ab-f-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#060B16"/>
      <stop offset="0.5" stop-color="#0B1530"/>
      <stop offset="1" stop-color="#14297A"/>
    </linearGradient>
    <linearGradient id="ab-f-stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E3A8A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#BFDBFE"/>
      <stop offset="1" stop-color="#1E3A8A" stop-opacity="0"/>
    </linearGradient>
    <filter id="ab-f-blur" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="ab-f-clip"><rect width="1200" height="110" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#ab-f-clip)">
    <rect width="1200" height="110" fill="url(#ab-f-bg)"/>
    <g fill="none" stroke-linecap="round">
      <path d="M -600 70 Q -450 30 -300 70 T 0 70 T 300 70 T 600 70 T 900 70 T 1200 70 T 1500 70 T 1800 70" stroke="#1E3A8A" stroke-width="1.2" opacity="0.8">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="26s" repeatCount="indefinite"/>
      </path>
      <path d="M -600 70 Q -450 30 -300 70 T 0 70 T 300 70 T 600 70 T 900 70 T 1200 70 T 1500 70 T 1800 70" stroke="#60A5FA" stroke-width="1" opacity="0.45" transform="translate(-300 0)">
        <animateTransform attributeName="transform" type="translate" from="-300 0" to="-900 0" dur="38s" repeatCount="indefinite"/>
      </path>
    </g>
    <rect x="300" y="54" width="600" height="2" rx="1" fill="#2563EB" opacity="0.5" filter="url(#ab-f-blur)"/>
    <rect x="300" y="54" width="600" height="1.5" rx="0.75" fill="url(#ab-f-stroke)"/>
    <text x="600" y="92" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#60A5FA" letter-spacing="3" opacity="0.85">MD ABDUL BASID</text>
  </g>
