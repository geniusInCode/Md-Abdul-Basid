<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ab-title-static ab-desc-static" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ab-title-static">Md Abdul Basid</title>
  <desc id="ab-desc-static">Data Analyst, Data Engineer, Data Scientist. Midnight blue banner with a technical grid, a rising chart and an extract, transform, load pipeline.</desc>
  <defs>
    <linearGradient id="ab-bg-static" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060B16"/>
      <stop offset="0.55" stop-color="#0B1530"/>
      <stop offset="1" stop-color="#14297A"/>
      
    </linearGradient>
    <radialGradient id="ab-glow-static" cx="0.8" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#1E3A8A" stop-opacity="0.8"/>
      <stop offset="0.55" stop-color="#14297A" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#060B16" stop-opacity="0"/>
      
    </radialGradient>
    <pattern id="ab-grid-static" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#60A5FA" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="ab-fade-static" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="ab-gridmask-static"><rect width="1200" height="420" fill="url(#ab-fade-static)"/></mask>
    <linearGradient id="ab-line-static" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E3A8A" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#2563EB"/>
      <stop offset="0.6" stop-color="#BFDBFE"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
      
    </linearGradient>
    <linearGradient id="ab-chart-static" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="0.6" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="ab-bar-static" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
    <filter id="ab-blur-static" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="ab-soft-static" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="ab-clip-static"><rect width="1200" height="420" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#ab-clip-static)">
    <rect width="1200" height="420" fill="url(#ab-bg-static)"/>
    <rect width="1200" height="420" fill="url(#ab-glow-static)"/>
    <rect width="1200" height="420" fill="url(#ab-grid-static)" opacity="0.2" mask="url(#ab-gridmask-static)"/>

    <!-- bars: quiet data backdrop -->
    <g opacity="0.55">
      <rect x="690" y="366" width="20" height="38" rx="3" fill="url(#ab-bar-static)"></rect>
      <rect x="728" y="344" width="20" height="60" rx="3" fill="url(#ab-bar-static)"></rect>
      <rect x="766" y="356" width="20" height="48" rx="3" fill="url(#ab-bar-static)"></rect>
      <rect x="804" y="320" width="20" height="84" rx="3" fill="url(#ab-bar-static)"></rect>
      <rect x="842" y="338" width="20" height="66" rx="3" fill="url(#ab-bar-static)"></rect>
      <rect x="880" y="300" width="20" height="104" rx="3" fill="url(#ab-bar-static)"></rect>
      <rect x="918" y="322" width="20" height="82" rx="3" fill="url(#ab-bar-static)"></rect>
      <rect x="956" y="282" width="20" height="122" rx="3" fill="url(#ab-bar-static)"></rect>
      <rect x="994" y="306" width="20" height="98" rx="3" fill="url(#ab-bar-static)"></rect>
      <rect x="1032" y="264" width="20" height="140" rx="3" fill="url(#ab-bar-static)"></rect>
      <rect x="1070" y="286" width="20" height="118" rx="3" fill="url(#ab-bar-static)"></rect>
      <rect x="1108" y="248" width="20" height="156" rx="3" fill="url(#ab-bar-static)"></rect>
      
    </g>

    <!-- chart line -->
    <path d="M -20 372 L 90 352 L 170 362 L 290 326 L 380 340 L 500 300 L 590 314 L 720 268 L 800 286 L 930 240 L 1010 258 L 1130 210 L 1230 222" fill="none" stroke="#1E3A8A" stroke-width="1" opacity="0.7"/>
    <path d="M -20 372 L 90 352 L 170 362 L 290 326 L 380 340 L 500 300 L 590 314 L 720 268 L 800 286 L 930 240 L 1010 258 L 1130 210 L 1230 222" fill="none" stroke="url(#ab-chart-static)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1000" stroke-dasharray="1000" opacity="0.65">
      
    </path>

    <!-- extract / transform / load pipeline -->
    <path d="M 760 210 C 820 110, 870 110, 930 210 S 1040 310, 1100 210" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.7"/>
    <g>
      <circle cx="760" cy="210" r="30" fill="#0B1530" stroke="#2563EB" stroke-width="1.5"/>
      <circle cx="760" cy="210" r="30" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.6">
        
      </circle>
      <circle cx="760" cy="210" r="6" fill="#BFDBFE"/>
      <text x="760" y="268" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#60A5FA" letter-spacing="2.5">EXTRACT</text>
    </g>
    <g>
      <circle cx="930" cy="210" r="30" fill="#0B1530" stroke="#2563EB" stroke-width="1.5"/>
      <circle cx="930" cy="210" r="30" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.6">
        
      </circle>
      <circle cx="930" cy="210" r="6" fill="#BFDBFE"/>
      <text x="930" y="268" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#60A5FA" letter-spacing="2.5">TRANSFORM</text>
    </g>
    <g>
      <circle cx="1100" cy="210" r="30" fill="#0B1530" stroke="#2563EB" stroke-width="1.5"/>
      <circle cx="1100" cy="210" r="30" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.6">
        
      </circle>
      <circle cx="1100" cy="210" r="6" fill="#BFDBFE"/>
      <text x="1100" y="268" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#60A5FA" letter-spacing="2.5">LOAD</text>
    </g>
    

    <!-- type -->
    <text x="70" y="128" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" fill="#60A5FA" letter-spacing="2">&gt; hello, world<tspan fill="#BFDBFE">_</tspan></text>
    <text x="68" y="206" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#F1F5F9" letter-spacing="0.5">Md Abdul Basid
      
    </text>
    <text x="70" y="252" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#BFDBFE" letter-spacing="1.6">Data Analyst  ·  Data Engineer  ·  Data Scientist
      
    </text>

    <!-- glowing underline -->
    <rect x="70" y="272" width="430" height="4" rx="2" fill="#2563EB" opacity="0.6" filter="url(#ab-blur-static)"/>
    <rect x="70" y="272" width="430" height="3" rx="1.5" fill="url(#ab-line-static)"/>

    <text x="70" y="314" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" fill="#60A5FA" letter-spacing="1.5" opacity="0.9">Python  /  SQL  /  Pandas  /  Power BI  /  ETL</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="17.5" fill="none" stroke="#1E3A8A" stroke-opacity="0.7"/>
</svg>
